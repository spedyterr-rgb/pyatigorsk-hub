# Раз в сутки записывает, сколько раз скачали каждую игру, — из этих замеров сайт рисует график по дням.
name: Daily download snapshot
on:
  schedule:
    - cron: "40 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml", "tools/snapshot.py"]
permissions:
  contents: write
concurrency: stats
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Take snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/snapshot.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Замер скачиваний за $(date -u +%F)"
          git push origin main
          git push --force origin main:gh-pages
